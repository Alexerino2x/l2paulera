# ===================================================================
# l2paulera - motor de battlegrounds (estilo WoW)
# Jogador entra na fila pela cidade com .bg, a partida abre numa
# instancia propria quando a fila enche, e todos voltam no fim.
# Valores desta maquina podem ir em config/local/battleground.properties
# ===================================================================

Enabled = True
MinLevel = 40
# So entra na fila quem estiver em zona de paz (cidade)
RequireTown = True
# Quando a fila atinge o minimo, espera isso antes de abrir (para mais gente entrar)
QueueCountdownSeconds = 30
# Tempo dentro da arena antes de liberar o combate
PrepareSeconds = 20
RespawnSeconds = 8
# Tempo para ver o resultado antes de voltar para a cidade
EndReturnSeconds = 10
# Para onde vai quem nao tem posicao salva (Giran, entrada do templo)
DefaultReturn = 84096,148618,-3404

# ---- Pontos de rank (por partida) --------------------------------
Points.Win = 30
Points.Loss = 10
Points.Draw = 15
Points.PerKill = 2
# maximo de pontos por abates numa partida
Points.KillCap = 20

# ---- Modos -------------------------------------------------------
# Spawns: x,y,z;x,y,z  (nos modos de time, um por time na ordem Azul;Vermelho)
# Padrao: Coliseu de Aden. Ajuste no jogo com /loc se cair fora do chao.

tvt.Enabled = True
tvt.MinPlayers = 4
tvt.MaxPlayers = 20
tvt.DurationMinutes = 10
tvt.ScoreLimit = 30
tvt.Spawns = 148600,45800,-3410;150400,45800,-3410

dm.Enabled = True
dm.MinPlayers = 3
dm.MaxPlayers = 12
dm.DurationMinutes = 8
dm.ScoreLimit = 20
dm.Spawns = 148600,45800,-3410;150400,45800,-3410;149500,45500,-3410;149500,46300,-3410

# Last Man Standing: sem renascer, vence o ultimo vivo
lms.Enabled = True
lms.MinPlayers = 3
lms.MaxPlayers = 16
lms.DurationMinutes = 8
lms.Spawns = 148600,45800,-3410;150400,45800,-3410;149500,45500,-3410;149500,46300,-3410;149000,46050,-3410;150000,46050,-3410

# Capture the Flag: clique na bandeira inimiga para pegar, clique na sua para pontuar
ctf.Enabled = True
ctf.MinPlayers = 4
ctf.MaxPlayers = 20
ctf.DurationMinutes = 15
# capturas para vencer
ctf.ScoreLimit = 3
ctf.Spawns = 148400,45800,-3410;150600,45800,-3410
# bandeira de cada time (Azul;Vermelho) e o NPC usado como bandeira
ctf.Flags = 148250,45800,-3410;150750,45800,-3410
ctf.FlagNpcId = 35062
